# RESALEVAULT - Configuracion del instalador de Windows
#
# Estado: el instalador se genera y se firma (ver docs/FIRMA.md). Con un
# certificado autofirmado de desarrollo Windows aun puede mostrar un aviso, y en
# equipos con Device Guard/AppLocker puede quedar bloqueado. Ver docs/FIRMA.md.

appId: com.resalevault.desktop
productName: RESALEVAULT
copyright: Copyright (c) RESALEVAULT

directories:
  output: release
  buildResources: build

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  # Todo lo que no sea imprescindible para ejecutar se queda fuera del paquete.
  # Importante: los paquetes de PRUEBA (smoke, ui-smoke, benchmark) NO viajan al
  # usuario. Solo se ejecutan desde el repositorio durante la verificacion.
  - '!out/smoke.cjs'
  - '!out/ui-smoke.cjs'
  - '!out/benchmark.cjs'
  - '!**/*.map'
  - '!**/*.ts'

# Avisos de licencias de terceros: obligatorios si se distribuye codigo ajeno.
# Se colocan en resources/ como fichero plano, legible sin abrir el asar.
extraResources:
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# Los datos del usuario NO viven aqui: estan en %APPDATA%\RESALEVAULT, de modo
# que desinstalar o actualizar nunca borra el inventario.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  # La firma se configura por variables de entorno (WIN_CSC_LINK y
  # WIN_CSC_KEY_PASSWORD). `npm run dist:signed` las pone automaticamente a
  # partir del certificado de desarrollo. Ver docs/FIRMA.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RESALEVAULT
  # La desinstalacion conserva la carpeta de datos del usuario a proposito.
  deleteAppDataOnUninstall: false
  artifactName: RESALEVAULT-Setup-${version}.${ext}

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
# IMPORTANTE: esta seccion NO se puede construir desde Windows. `codesign` y
# `notarytool` existen unicamente en macOS, y electron-builder necesita ademas
# una maquina Apple para empaquetar el .app. Se deja configurada para que en un
# Mac la compilacion sea un solo comando:
#
#   npm run build && npx electron-builder --mac --config electron-builder.yml
#
# Sin certificado de desarrollador de Apple (99 EUR/ano) el resultado NO queda
# firmado ni notarizado: macOS mostrara el aviso de "desarrollador no
# identificado" y Gatekeeper pedira abrirlo con clic derecho > Abrir. Ver
# docs/DISTRIBUCION.md para las opciones gratuitas y las limitaciones.
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.png
  # Se exige el "entitlements" minimo: sin el, el sandbox de macOS y la propia
  # firma fallan al abrir el navegador integrado o al escribir en userData.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: RESALEVAULT-${version}-${arch}.${ext}

# ---------------------------------------------------------------------------
# Auto-actualizacion (electron-updater + GitHub Releases)
# ---------------------------------------------------------------------------
# El feed de actualizaciones es el propio repositorio de GitHub. Al publicar un
# release con el instalador adjunto, la app detecta la nueva version, la
# descarga y la instala automaticamente (sin firma de CA: la verificacion de
# firma de codigo esta desactivada para builds sin certificado).
publish:
  provider: github
  owner: 16ray
  repo: RESALEVAULT
  releaseType: release
  # El fondo y el diseno por defecto son suficientes; no se incrustan recursos
  # propietarios para mantener el paquete pequeno.
