# RESALEVAULT - Configuracion del instalador de Windows
#
# Estado: el instalador se genera y se firma (ver docs/FIRMA.md). Con un
# certificado autofirmado de desarrollo Windows aun puede mostrar un aviso, y en
# equipos con Device Guard/AppLocker puede quedar bloqueado. Ver docs/FIRMA.md.

appId: com.resalevault.desktop
productName: RESALEVAULT
copyright: Copyright (c) RESALEVAULT

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Todo lo que no sea imprescindible para ejecutar se queda fuera del paquete.
  - '!**/*.map'
  - '!**/*.ts'

# Avisos de licencias de terceros: obligatorios si se distribuye codigo ajeno.
# Se colocan en resources/ como fichero plano, legible sin abrir el asar.
extraResources:
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# Los datos del usuario NO viven aqui: estan en %APPDATA%\RESALEVAULT, de modo
# que desinstalar o actualizar nunca borra el inventario.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  # La firma se configura por variables de entorno (WIN_CSC_LINK y
  # WIN_CSC_KEY_PASSWORD). `npm run dist:signed` las pone automaticamente a
  # partir del certificado de desarrollo. Ver docs/FIRMA.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RESALEVAULT
  # La desinstalacion conserva la carpeta de datos del usuario a proposito.
  deleteAppDataOnUninstall: false
  artifactName: RESALEVAULT-Setup-${version}.${ext}
